[package]
name = "fb_timing"
version = "0.1.0"
edition = "2021"

[dependencies]
# Pinned to the commit of the v0.2.13 release line; feature set equals the
# released Python wheel (see fusion-blossom pyproject.toml [tool.maturin]),
# minus python_binding. No progress bar, no visualizer, single thread.
fusion-blossom = { git = "https://github.com/yuewuo/fusion-blossom.git", rev = "fa69060", default-features = false, features = ["remove_blossom_v", "dangerous_pointer", "u32_index", "i32_weight", "disable_visualizer"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
debug = false
lto = false
codegen-units = 16
