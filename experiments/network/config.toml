# The syndrome network under load: transport time from N controllers to the decoder (paper: Fig. 5, N1).
# Every setting of the runs is in this file; the sourced constants (cycle time, Ethernet framing, node delays,
# controller sizes, the links) are the tables network_parameters.csv and network_links.csv in paths.literature.
# The Makefile and `python -m qecnet` read it. Paths are relative to this file.

[paths]
literature = "../../data/literature"          # network_parameters.csv, network_links.csv
data = "../../data/zenodo/network"            # the recorded campaign (if present): runs in sim/raw and the tables `make check` regenerates
runs = "../../build/data/network/sim/raw"     # runs the statistics read: this experiment's own (`make simulate`)
output = "../../build/data/network"           # everything the experiment writes (the layout of data/zenodo/network)
check = "../../build/check/network"           # where `make check` regenerates the recorded tables

[simulate]
workers = 0             # processes; 0 = all cores but two

# topologies, the links each one is run on (names of network_links.csv) and its aggregation settings
# (0 = forward, 1 = merge the frames of a cycle)
[sweep]
n = [8, 16, 32, 64, 128, 300, 1000, 4000, 16000]
links = { T1 = ["L1", "L2", "L4", "L7"], T2 = ["L5-10G", "L5-100G"], T3 = ["L3", "L2", "L7", "L5-10G"], "T3-k7" = ["L3", "L2", "L7", "L5-10G"], T4 = ["L6-10G", "L6-100G"] }
aggregation = { T1 = [0], T2 = [0, 1], T3 = [0, 1], "T3-k7" = [0, 1], T4 = [0] }
# the 10GbE variant of each topology, drawn in the paper's N1; the edge set runs each of them at its largest stable
# N and the next N, so that every line runs to where its port saturates
n1_links = { T1 = "L4", T2 = "L5-10G", T3 = "L5-10G", "T3-k7" = "L5-10G", T4 = "L6-10G" }

# scenarios: b bits per outcome; S3 adds a burst every d cycles (all controllers in the same cycle). S3 runs on the
# topologies listed, with d = 13 except on the links of d_sweep; it is not run on the port-capped tree
[scenarios.S1]
b = 1

[scenarios.S2]
b = 4

[scenarios.S3]
b = 1
d = 13
topologies = ["T1", "T2", "T3", "T4"]
d_sweep = [
    { topology = "T2", link = "L5-10G", d = [5, 13, 25] },
    { topology = "T3", link = "L2", d = [5, 13, 25] },
]

# simulated cycles and seeds
[cycles]
warmup = 50
recorded = 200            # fixed latencies (+ 2 d in S3)
jitter = 10000            # random latency (L3)
jitter_small_n = 100000   # random latency at N <= small_n
small_n = 1000
seed = 20261020

# R x L grid of synthetic Ethernet links (bound; its diagonal is also simulated)
[grid]
rates_gbps = [1, 10, 25, 100, 400]
latencies_ns = [50, 100, 200, 400, 800]
topologies = ["T2", "T4"]
scenarios = ["S1", "S2"]
